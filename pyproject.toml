[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofmesh"
version = "1.0.0"
description = "Proof-carrying execution control plane for multi-agent business actions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi==0.115.11",
  "uvicorn==0.34.0",
  "pydantic==2.10.6",
  "PyYAML==6.0.2",
  "cryptography>=44,<46",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx>=0.27,<1"]
mcp = []
production = ["psycopg[binary]==3.2.9"]

[project.scripts]
proofmesh = "proofmesh.cli:main"
proofmesh-mcp = "proofmesh.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proofmesh = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
