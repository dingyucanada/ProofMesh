  worker: https://github.com/agentscope-ai/AgentTeams/blob/78d0ceda336befa6e62bf89fc1a6b08b965e128d/helm/hiclaw/crds/workers.agentteams.io.yaml
  team: https://github.com/agentscope-ai/AgentTeams/blob/78d0ceda336befa6e62bf89fc1a6b08b965e128d/helm/hiclaw/crds/teams.agentteams.io.yaml
