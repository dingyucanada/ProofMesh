contract:
  apiVersion: agentteams.io/v1beta1
  Human:
    requiredSpec: [displayName, permissionLevel]
    allowedSpec: [displayName, username, email, permissionLevel, accessibleTeams, accessibleWorkers, identitySource, note]
    permissionLevels: [1, 2, 3]
  Worker:
    requiredSpec: [model]
    allowedSpec: [model, modelProvider, runtime, image, workerName, identity, soul, agents, skills, remoteSkills, mcpServers, package, expose, channelPolicy, channels, containerManaged, resources, idleTimeout, state, deployMode, serviceEnabled, backendRuntime, labels, env, agentIdentity, credentialBindings, accessEntries]
    runtimes: [openclaw, copaw, hermes, qwenpaw]
    states: [Running, Sleeping, Stopped]
    deployModes: [Local, Edge]
    backendRuntimes: [pod]
    mcpTransports: [http, sse]
  Team:
    allowedSpec: [description, teamName, workerMembers, peerMentions, channelPolicy, heartbeatEvery, admin, humanMembers, leader, workers]
    memberRoles: [team_leader, worker]
