apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: case-orchestrator
  labels:
    proofmesh.io/workload: refund
    proofmesh.io/stage: create
spec:
  model: qwen3.5-plus
  runtime: qwenpaw
  image: proofmesh/agentteams-qwenpaw-worker:v1.2.0-beta.1-compat2
  mcpServers:
    - name: proofmesh
      url: http://proofmesh:8000/mcp/roles/orchestrator
      transport: http
  resources:
    requests: {cpu: 300m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  state: Running
  deployMode: Local
  serviceEnabled: false
  backendRuntime: pod
  labels:
    proofmesh.io/role: orchestrator
    proofmesh.io/workload: refund
---
